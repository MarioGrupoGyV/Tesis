name: riesgo-escolar-tests
services:
  dbtest:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: riesgo_escolar_test
      POSTGRES_USER: riesgo_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_password
      TZ: UTC
      PGTZ: UTC
    secrets: [owner_password, app_password]
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U riesgo_owner -d riesgo_escolar_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tester:
    build:
      context: ..
      dockerfile: infra/docker/test.Dockerfile
    depends_on:
      dbtest:
        condition: service_healthy
    secrets: [owner_url, app_url]
    environment:
      TEST_REPORT_NAME: "${TEST_REPORT_NAME:-s2-1-backend}"
      IMPORT_STORAGE_DIR: /tmp/s2-imports
    volumes:
      - ../tests/evidence:/evidence
secrets:
  owner_password:
    file: ../.local/runtime-secrets/owner-password
  app_password:
    file: ../.local/runtime-secrets/app-password
  owner_url:
    file: ../.local/runtime-secrets/owner-database-url
  app_url:
    file: ../.local/runtime-secrets/app-database-url
volumes:
  test_db_data:
