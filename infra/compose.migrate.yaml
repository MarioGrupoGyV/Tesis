# Solo el contenedor efímero de migración recibe el secreto de propietario.
services:
  api:
    environment:
      MIGRATION_DATABASE_URL_FILE: /run/secrets/owner_database_url
    secrets: [owner_database_url]
secrets:
  owner_database_url:
    file: "${APP_SECRETS_DIR:-./.local/runtime-secrets}/owner-database-url"
