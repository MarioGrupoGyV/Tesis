# S1 DEMO. La semilla es explícita; reiniciar no modifica datos.
name: riesgo-escolar-demo
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: riesgo_escolar_demo
      POSTGRES_USER: riesgo_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_password
      TZ: UTC
      PGTZ: UTC
    secrets: [owner_password, app_password]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U riesgo_owner -d riesgo_escolar_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/app_database_url
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      APP_ENV: development
      DATA_ORIGIN: DEMO
      REAL_MODE_ENABLED: "false"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:15173,http://127.0.0.1:15173}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      TZ: UTC
      DISPLAY_TIMEZONE: America/Lima
    secrets: [app_database_url, csrf_secret]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:5173"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  db_data:
secrets:
  owner_password:
    file: "${S1_SECRETS_DIR:-./.local/secrets}/owner-password"
  app_password:
    file: "${S1_SECRETS_DIR:-./.local/secrets}/app-password"
  app_database_url:
    file: "${S1_SECRETS_DIR:-./.local/secrets}/app-database-url"
  csrf_secret:
    file: "${S1_SECRETS_DIR:-./.local/secrets}/csrf-secret"
  demo_credentials:
    file: "${S1_SECRETS_DIR:-./.local/secrets}/demo-credentials.json"
x-sprint:
  current: S1
  runtime-implemented: true
  implemented-scope: [health, auth, periods, sections]
  planned-services: [web, api, db]
  planned-images:
    node: node:24.14.1-bookworm-slim
    python: python:3.12.12-slim-bookworm
    postgres: postgres:17.6-bookworm
