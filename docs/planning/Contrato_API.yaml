  /imports/preview:
    post:
      operationId: previewImport
      summary: Validar CSV y crear vista previa
      tags:
      - imports
      x-stage: S3.1
      x-roles:
      - ADMIN
      description: 'Sesión → ADMIN → CSRF → preparación del servidor → entrada → contexto/origen → procedencia
        exacta. REAL: 422 INSTITUTIONAL_PROCESSING_NOT_READY. SYNTHETIC: solo archivo/hash/contexto del estudio
        registrado, UNREGISTERED_SYNTHETIC_FILE 422 para modificado/no registrado. Sin flag de origen del cliente.
        Conserva parser, límites, expected_preview_version, stale 409, transacción, revisiones e idempotencia.
        Confirmación vincula etiquetas/resultados privados a cortes verificados sin exponerlos.'
      responses:
        '201': &id006
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          description: Sesión inválida
          content:
