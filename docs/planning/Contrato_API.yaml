              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Token CSRF ligado a la sesión; validarlo en servidor.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
