openapi: 3.1.0
info:
  title: Contrato de Seguimiento Escolar
  version: 0.5.0
  description: 'S5: seguimiento y reportes operativos del estudio SYNTHETIC registrado. REAL bloqueado. Sin
    eficacia escolar, S6 ni entrenamiento/activación HTTP.'
servers:
- url: /api/v1
  description: Preferir proxy de mismo origen para cookies y CSRF
security:
- sessionCookie: []
tags:
- name: health
- name: auth
- name: catalogs
- name: students
- name: imports
- name: ml
- name: processing
- name: followup
- name: reports
paths:
  /health/live:
    get:
      operationId: live
      summary: Disponibilidad del proceso
      tags:
      - health
      x-stage: S2.1
      x-roles: []
      description: No revelar configuración ni secretos.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: ready
      summary: Disponibilidad de base de datos
      tags:
      - health
      x-stage: S2.1
      x-roles: []
      description: 200 si la base está disponible; 503 en caso contrario.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      tags:
      - auth
      x-stage: S2.1
      x-roles: []
      description: Comprobar Origin, limitar intentos y validar credenciales. Usar cookie de sesión; sin registro
        público.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: sesión HttpOnly; SameSite=Lax; Path=/; Secure en HTTPS. La cookie no se devuelve
                en JSON.
              schema:
                type: string
        '422':
          description: Entrada invalida, origen no admitido o INSTITUTIONAL_PROCESSING_NOT_READY en escrituras
            de importacion; sin escrituras escolares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de intentos excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origen de solicitud no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio de base de datos no disponible. Error sanitizado; sin consultas, parametros
            ni secretos. Los conflictos de integridad se devuelven como errores de dominio 409/422, nunca 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno inesperado sanitizado; no se exponen detalles de base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de integridad o concurrencia; resolver el estado y reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
