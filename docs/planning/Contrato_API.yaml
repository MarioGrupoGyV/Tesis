            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
  /imports/{id}/commit:
    post:
      operationId: commitImport
      summary: Confirmar lote sin errores
      tags:
      - imports
      x-stage: S2.1
      x-roles:
      - ADMIN
      description: 'Bloqueado con 422 INSTITUTIONAL_PROCESSING_NOT_READY hasta implementar procedencia
        autorizada, escala, periodo, ventanas, fechas y calidad. Exige sesion ADMIN y CSRF. No persiste
        archivos ni registros escolares. Motor preservado: UTF-8, 5 MiB, 10000 filas, transaccion, idempotencia,
        revision inmutable y expected_preview_version.'
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommit'
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Rol, alcance o CSRF no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de versión, periodo bloqueado o modelo no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Entrada invalida, origen no admitido o INSTITUTIONAL_PROCESSING_NOT_READY en escrituras
            de importacion; sin escrituras escolares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio de base de datos no disponible. Error sanitizado; sin consultas, parametros
            ni secretos. Los conflictos de integridad se devuelven como errores de dominio 409/422, nunca
            503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno inesperado sanitizado; no se exponen detalles de base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Token CSRF ligado a la sesión; validarlo en servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_preview_version:
                  type: integer
                  minimum: 1
              required:
              - expected_preview_version
              additionalProperties: false
