      - cutoff_at
      - target_date
      - predicted_at
      - probabilities_calibrated
      - probability_low
      - probability_medium
      - probability_high
      additionalProperties: false
      description: Probabilidades todas null o todas presentes; suma 1 con tolerancia 0.00001. Validar suma
        en servidor. calibrated true exige valores presentes.
      allOf:
      - oneOf:
        - properties:
            probability_low:
              type: 'null'
            probability_medium:
              type: 'null'
            probability_high:
              type: 'null'
        - properties:
            probability_low:
              type: number
            probability_medium:
              type: number
            probability_high:
              type: number
      - if:
          properties:
            probabilities_calibrated:
              const: true
        then:
          properties:
            probability_low:
              type: number
