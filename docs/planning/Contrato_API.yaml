          description: VERSION_CONFLICT, CREATION_KEY_CONFLICT, PERIOD_LOCKED, INVALID_TRANSITION o MODEL_NOT_AVAILABLE;
            sin escrituras parciales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR, INSTITUTIONAL_PROCESSING_NOT_READY o procedencia/fechas no admitidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SERVICE_UNAVAILABLE sanitizado; conflictos de integridad conservan 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno sanitizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionPatch'
  /reports/summary:
    get:
      operationId: reportSummary
      summary: Resumen ACTUAL del conjunto filtrado autorizado, unidad matrícula
      tags:
      - reports
      x-stage: S5
      x-roles: *id016
      description: Resumen ACTUAL del conjunto filtrado autorizado, unidad matrícula. Total=evaluated+not_evaluated+insufficient_data;
        evaluated=LOW+MEDIUM+HIGH. Porcentajes de riesgo sobre evaluados con denominador y null si cero. Casos/actividades
        agregados antes de unir; DONE única actividad realizada. generated_at servidor y rango de últimos cortes.
        items paginados; agregados cubren conjunto completo. Lectura consistente, sin eficacia ni métricas
        ML.
      parameters:
      - *id019
      - *id020
      - *id021
      - &id024
        name: risk_level
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - &id025
        name: evaluation_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - EVALUATED
          - NOT_EVALUATED
          - INSUFFICIENT_DATA
      - &id026
        name: alert_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - IN_REVIEW
          - RESOLVED
          - DISMISSED
      - *id022
      - *id023
      responses:
        '200':
          description: Resultado público actual del estudio sintético
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '401':
          description: SESSION_INVALID; sin sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN o CSRF_INVALID; rol/CSRF antes del cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso no disponible; ajeno e inexistente indistinguibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: VERSION_CONFLICT, CREATION_KEY_CONFLICT, PERIOD_LOCKED, INVALID_TRANSITION o MODEL_NOT_AVAILABLE;
            sin escrituras parciales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR, INSTITUTIONAL_PROCESSING_NOT_READY o procedencia/fechas no admitidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SERVICE_UNAVAILABLE sanitizado; conflictos de integridad conservan 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno sanitizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/export.csv:
    get:
      operationId: exportReportCsv
      summary: Solicitar CSV completo del mismo conjunto actual y filtros de resumen
      tags:
      - reports
      x-stage: S5
      x-roles: *id016
      description: Solicitar CSV completo del mismo conjunto actual y filtros de resumen. Orden código/UUID,
        una matrícula por fila. Alcance/origen/periodo/generated_at públicos; no notas, narraciones, etiquetas,
        métricas privadas. Attachment/no-store; errores JSON Error. Audita solicitud/actor/filtros/alcance/instante/conteo,
        no apertura/guardado del archivo.
      parameters:
      - *id019
      - *id020
      - *id021
      - *id024
      - *id025
      - *id026
      responses:
        '200':
          description: UTF-8 con BOM; una fila por matrícula del conjunto filtrado completo, null celda vacía.
            Textos con prefijos de fórmula se neutralizan con apóstrofo y controles eliminados en proyección.
            No notas/etiquetas/ML privado.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="seguimiento-escolar-reporte.csv"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: SESSION_INVALID; sin sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN o CSRF_INVALID; rol/CSRF antes del cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso no disponible; ajeno e inexistente indistinguibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: VERSION_CONFLICT, CREATION_KEY_CONFLICT, PERIOD_LOCKED, INVALID_TRANSITION o MODEL_NOT_AVAILABLE;
            sin escrituras parciales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: VALIDATION_ERROR, INSTITUTIONAL_PROCESSING_NOT_READY o procedencia/fechas no admitidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SERVICE_UNAVAILABLE sanitizado; conflictos de integridad conservan 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno sanitizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      type: object
