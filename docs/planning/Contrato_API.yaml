            de importacion; sin escrituras escolares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200': *id006
        '503':
          description: Servicio de base de datos no disponible. Error sanitizado; sin consultas, parametros
            ni secretos. Los conflictos de integridad se devuelven como errores de dominio 409/422, nunca 503.
          content:
