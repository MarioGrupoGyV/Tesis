  /imports/preview:
    post:
      operationId: previewImport
      summary: Validar CSV y crear vista previa
      tags:
      - imports
      x-stage: S2.1
      x-roles:
      - ADMIN
      description: 'Bloqueado con 422 INSTITUTIONAL_PROCESSING_NOT_READY hasta implementar procedencia
