        details:
          type: array
          items:
            type: object
            properties:
              field:
                type:
                - string
                - 'null'
              row:
                type:
                - integer
                - 'null'
              message:
                type: string
            required:
            - message
            additionalProperties: false
        request_id: *id003
      required:
      - code
      - message
      - details
      - request_id
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      required:
      - status
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id003
        display_name:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - TUTOR
          - DIRECTOR
          - RESEARCHER
      required:
      - id
      - display_name
      - role
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
