  /imports/preview:
    post:
      operationId: previewImport
      summary: Validar CSV y crear vista previa
      tags:
      - imports
      x-stage: DAY_1_DEMO
      x-roles:
      - ADMIN
      description: Máximo 5 MiB y 10000 filas. UTF-8. Cabeceras del manual. CSV confirmado no admite etiquetas
        ni riesgo predicho. La API bloquea REAL. El hash y periodo reutilizan un lote previo. Puede devolver
        200 si el lote ya existe.
      responses:
        '201': &id006
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
