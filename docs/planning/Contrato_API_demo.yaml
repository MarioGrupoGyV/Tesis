  /dashboard:
    get:
      operationId: dashboard
      summary: Consultar indicadores autorizados
      tags:
      - dashboard
      x-stage: DAY_1_DEMO
      x-roles: *id001
      description: Últimos cortes y predicciones compatibles por matrícula. Solo EVALUATED si la predicción
        corresponde al último corte y modelo activo; tras un corte nuevo, mostrar NOT_EVALUATED y riesgo actual
        null hasta reevaluar. Conservar riesgo anterior en timeline. evaluated + not_evaluated = enrolled.
        risk_distribution suma evaluated. active_alerts cuenta casos activos, que pueden permanecer aunque
        baje el riesgo.
      responses:
        '200':
          description: Operación completada
