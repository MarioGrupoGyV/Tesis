          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos; REAL_MODE_NOT_READY en fase demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200': *id006
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Token CSRF ligado a la sesión; validarlo en servidor.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                period_id: *id003
              required:
              - file
              - period_id
              additionalProperties: false
