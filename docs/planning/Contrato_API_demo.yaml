openapi: 3.1.0
info:
  title: Contrato demo de Seguimiento Escolar
  version: 0.1.0
  description: Contrato de diseño para implementar la primera demo. No representa un servidor existente. Procesamiento
    REAL bloqueado. Escalas sintéticas 0..20 y participación 1..3. API de investigación prevista en etapa posterior.
servers:
- url: /api/v1
  description: Preferir proxy de mismo origen para cookies y CSRF
security:
- sessionCookie: []
tags:
- name: health
- name: auth
- name: catalogs
- name: students
- name: imports
- name: predictions
- name: dashboard
- name: models
- name: alerts
- name: interventions
- name: reports
- name: audit
paths:
  /health/live:
    get:
      operationId: live
      summary: Disponibilidad del proceso
      tags:
      - health
      x-stage: DAY_1_DEMO
      x-roles: []
      description: No revelar configuración ni secretos.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: ready
      summary: Disponibilidad de base de datos
      tags:
      - health
      x-stage: DAY_1_DEMO
      x-roles: []
      description: 200 si la base está disponible; 503 en caso contrario.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      tags:
      - auth
      x-stage: DAY_1_DEMO
      x-roles: []
      description: Comprobar Origin, limitar intentos y validar credenciales. Usar cookie de sesión; sin registro
        público.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          headers:
            Set-Cookie:
              description: sesión HttpOnly; SameSite=Lax; Path=/; Secure en HTTPS. La cookie no se devuelve
                en JSON.
              schema:
                type: string
        '422':
          description: Datos inválidos; REAL_MODE_NOT_READY en fase demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de intentos excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origen de solicitud no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/me:
    get:
      operationId: me
      summary: Consultar usuario actual
      tags:
      - auth
      x-stage: DAY_1_DEMO
      x-roles:
      - ADMIN
      - TUTOR
      - DIRECTOR
      - RESEARCHER
      description: Aplicar permisos de recurso y bloquear origen REAL durante esta fase.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Sesión inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Rol, alcance o CSRF no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de versión, periodo bloqueado o modelo no disponible
