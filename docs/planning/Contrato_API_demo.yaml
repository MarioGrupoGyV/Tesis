          type: boolean
      required:
      - id
      - enrollment_id
      - snapshot_id
      - model_id
      - data_origin
      - risk_level
      - cutoff_at
      - target_date
      - predicted_at
      - probabilities_calibrated
      additionalProperties: false
    Student:
      type: object
      properties:
        id: *id003
        anon_code:
          type: string
        enrollment_id: *id003
        period_id: *id003
        section_id: *id003
        section_code:
          type: string
        grade:
          type: integer
        data_origin: *id009
        average_grade:
          type:
          - number
          - 'null'
        attendance_pct:
          type:
          - number
          - 'null'
        latest_cutoff_at:
          type:
          - string
          - 'null'
          format: date-time
        risk_level:
          type:
          - string
          - 'null'
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - null
        evaluation_status:
          type: string
          enum:
          - EVALUATED
          - NOT_EVALUATED
          - INSUFFICIENT_DATA
        active_alert_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - anon_code
      - enrollment_id
      - period_id
      - section_id
      - section_code
      - grade
      - data_origin
      - evaluation_status
      additionalProperties: false
    StudentDetail:
      type: object
      properties:
        student:
          $ref: '#/components/schemas/Student'
        latest_snapshot:
          anyOf:
          - $ref: '#/components/schemas/Snapshot'
          - type: 'null'
        latest_prediction:
          anyOf:
          - $ref: '#/components/schemas/Prediction'
          - type: 'null'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/Intervention'
      required:
      - student
      - latest_snapshot
      - latest_prediction
      - alerts
      - interventions
      additionalProperties: false
    TimelineEvent:
      type: object
      properties:
        id: *id003
        event_type:
          type: string
          enum:
          - SNAPSHOT
          - PREDICTION
          - ALERT
          - INTERVENTION
        occurred_at: *id010
        summary:
          type: string
        entity_id: *id003
      required:
      - id
      - event_type
      - occurred_at
      - summary
      - entity_id
