components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type:
                - string
                - 'null'
              row:
                type:
                - integer
                - 'null'
              message:
                type: string
            required:
            - message
            additionalProperties: false
        request_id: *id003
      required:
      - code
      - message
      - details
      - request_id
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      required:
      - status
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id003
        display_name:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - TUTOR
          - DIRECTOR
          - RESEARCHER
      required:
      - id
      - display_name
      - role
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
      - password
      additionalProperties: false
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        expires_at: &id010
          type: string
          format: date-time
      required:
      - user
      - csrf_token
      - expires_at
      additionalProperties: false
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
      additionalProperties: false
    Period:
      type: object
      properties:
        id: *id003
        code:
          type: string
        start_date: &id008
          type: string
          format: date
        end_date: *id008
        data_origin: &id009
          type: string
          enum:
          - DEMO
          - REAL
        is_locked:
          type: boolean
      required:
      - id
      - code
      - start_date
      - end_date
      - data_origin
      - is_locked
      additionalProperties: false
    Section:
      type: object
      properties:
        id: *id003
        code:
          type: string
        grade:
          type: integer
          minimum: 1
          maximum: 5
        school_year:
          type: integer
        tutor_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - code
      - grade
      - school_year
      additionalProperties: false
    Snapshot:
      type: object
      properties:
        id: *id003
        enrollment_id: *id003
        period_id: *id003
        data_origin: *id009
        window_start: *id008
        cutoff_at: *id010
        available_at: *id010
        target_date: *id008
        revision:
          type: integer
          minimum: 1
        average_grade:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 20
        attendance_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        activities_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        participation_level:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3
        behavior_incidents:
          type:
          - integer
          - 'null'
          minimum: 0
        age_years:
          type:
          - integer
          - 'null'
          minimum: 5
          maximum: 25
        missing_fraction:
          type: number
          minimum: 0
          maximum: 1
      required:
      - id
      - enrollment_id
      - period_id
      - data_origin
      - window_start
      - cutoff_at
      - available_at
      - target_date
      - revision
      - missing_fraction
      additionalProperties: false
    Prediction:
      type: object
      properties:
        id: *id003
        enrollment_id: *id003
        snapshot_id: *id003
        model_id: *id003
        data_origin: *id009
        risk_level: *id011
        cutoff_at: *id010
        target_date: *id008
        predicted_at: *id010
        probability_low:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        probability_medium:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        probability_high:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
